[versions]
kotlin = "2.4.10"
kotlinx-serialization = "1.11.0"
ktor = "3.5.2"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
ktor-server-core = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor" }
arrow-core = { module = "io.arrow-kt:arrow-core", version = "2.2.3" }
minecraft-rcon = { module = "org.glavo:rcon-java", version = "3.0" }
minecraft-brigadier = { module = "com.mojang:brigadier", version = "1.3.11" }
minecraft-nbt = { module = "net.kyori:adventure-nbt", version = "5.2.0" }
jline = { module = "org.jline:jline", version = "4.3.1" }

[bundles]
minecraft = ["minecraft-rcon", "minecraft-brigadier", "minecraft-nbt"]

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.5.1" }
